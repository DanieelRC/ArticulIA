server {
    listen 80;
    root /usr/share/nginx/html;

    # /api/ask -> http://api:8000/ask
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # SSE: entregar cada evento en cuanto llega, sin juntar en el buffer.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
