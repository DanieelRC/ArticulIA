# Primera barrera contra abuso: límites por IP antes de llegar a la API (que tiene los suyos).
limit_req_zone  $binary_remote_addr zone=preguntas:10m rate=12r/m;
limit_req_zone  $binary_remote_addr zone=lectura:10m   rate=120r/m;
limit_conn_zone $binary_remote_addr zone=conexiones:10m;

server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # Detrás de Caddy (producción) la IP real viene en X-Forwarded-For. Solo se confía en ese
    # encabezado si la conexión llega desde la red privada de Docker.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 8k;      # una pregunta son 500 caracteres; nada legítimo pesa más
    client_body_timeout 10s;
    limit_req_status 429;
    limit_conn_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Preguntas al agente: cuestan dinero. Pocas por minuto y dos conexiones a la vez por IP.
    location /api/ask {
        limit_req  zone=preguntas burst=4 nodelay;
        limit_conn conexiones 2;
        proxy_pass http://api:8000/ask;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # se sobrescribe: el cliente no lo dicta
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE: entregar cada evento en cuanto llega, sin juntar en el buffer.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Lecturas del corpus: baratas, pero tampoco ilimitadas.
    location /api/ {
        limit_req zone=lectura burst=40 nodelay;
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
