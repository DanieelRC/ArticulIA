services:
  db:
    image: pgvector/pgvector:pg16
    container_name: articulia-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-articulia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-articulia}
      POSTGRES_DB: ${POSTGRES_DB:-articulia}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/articulia/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
