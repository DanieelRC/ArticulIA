services:
  db:
    image: pgvector/pgvector:pg16
    container_name: articulia-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-articulia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-articulia}
      POSTGRES_DB: ${POSTGRES_DB:-articulia}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/articulia/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: articulia-api
    env_file: .env
    environment:
      # Dentro de la red de Compose la base se llama "db", no "localhost".
      DATABASE_URL: postgresql://${POSTGRES_USER:-articulia}:${POSTGRES_PASSWORD:-articulia}@db:5432/${POSTGRES_DB:-articulia}
    ports:
      - "8000:8000"
    volumes:
      # Reusa los modelos ya descargados en el host (~4.5 GB) en vez de bajarlos otra vez.
      - ${HF_CACHE:-~/.cache/huggingface}:/models
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build: ./frontend
    container_name: articulia-web
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  pgdata:
