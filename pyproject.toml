[project]
name = "articulia"
version = "0.1.0"
description = "Agente que responde preguntas sobre leyes federales mexicanas citando el artículo exacto."
readme = "README.md"
authors = [
    { name = "Daniel", email = "danieeelrc@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "langchain-anthropic>=1.7.10",
    "langchain-community>=0.4.1,<0.4.2",
    "langchain-core>=1.8.0",
    "langchain-google-genai>=4.5.0",
    "langchain-xai>=1.3.0",
    "langgraph>=1.2.20",
    "langsmith>=0.14.17",
    "mcp>=2.3.0",
    "pgvector>=0.5.1",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pymupdf>=2.1",
    "ragas>=0.4.3",
    "sentence-transformers>=6.3.0",
    "torch>=2.15",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
articulia-mcp = "articulia.mcp_server:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Fragmentos literales de los PDFs con sus saltos de línea originales.
"tests/test_splitter.py" = ["E501"]

# torch solo para CPU: en Linux (Docker, CI) evita bajar ~3 GB de librerías CUDA.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
