[project]
name = "articulia"
version = "0.1.0"
description = "Agente que responde preguntas sobre leyes federales mexicanas citando el artículo exacto."
readme = "README.md"
authors = [
    { name = "Daniel", email = "danieeelrc@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
